# Hybrid A* Path Planning Package
# Unified package containing all Hybrid A* implementations

[project]
name = "hybrid-astar"
version = "1.0.0"
description = "Hybrid A* Path Planning Algorithm - Complete implementation with Python, C++, and visualization"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Path Tracking Team"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "rich>=12.0.0",
    "loguru>=0.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Python visualization (astar_project)
python-viz = [
    "foxglove-schemas-protobuf>=0.3.0",
    "foxglove-sdk>=0.10.1",
]

# C++ core (hybrid_astar_core)
cpp-core = [
    # C++ dependencies are managed via CMake
]

# C++ bindings (astar_cpp)
cpp-bindings = [
    "pybind11>=2.6.0",
]

# eCAL integration
ecal = [
    # eCAL dependencies are system-level
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
