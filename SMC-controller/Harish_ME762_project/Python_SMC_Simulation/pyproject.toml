[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-simulation"
version = "0.1.0"
description = "Sliding Mode Control Simulation for Vehicle Path Tracking"
authors = [
    {name = "Harish N Sathishchandra"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["controllers", "models", "trajectory", "utils", "visualization"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[project.scripts]
smc-demo = "example_usage:main"
smc-test = "run_test:main"
